<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #1e1e1e;
      color: #fff;
      width: 400px;
    }
    h2 { border-bottom: 1px solid #444; padding-bottom: 8px; color: #00adb5; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background-color: #333;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #00adb5;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover { background-color: #008c95; }
    #status { margin-top: 10px; font-size: 13px; color: #4caf50; }
  </style>
</head>
<body>
  <h2>Настройки трекера</h2>
  <div class="form-group">
    <label for="domain">Текущий рабочий адрес сайта:</label>
    <input type="text" id="domain" placeholder="https://knvd1.xyz">
  </div>
  <button id="save">Сохранить адрес</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
